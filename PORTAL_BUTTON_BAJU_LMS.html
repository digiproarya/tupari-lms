<!-- Tombol portal TuPARI: guru diarahkan ke frontend pusat dengan URL backend sekolah -->
<section class="tupari-replikasi">
  <h2>Buat LMS Sekolah Anda</h2>
  <p>TuPARI membantu sekolah membuat ruang belajar digital. Backend dan database dibuat di akun Google sekolah Anda.</p>
  <a id="buat-lms" href="#" class="tupari-btn">Buat LMS Saya</a>
  <small>Anda akan mengikuti panduan instalasi dan menggunakan akun Google sendiri.</small>
</section>
<script>
(function(){
  const FRONTEND_URL = "https://URL-FRONTEND-TUPARI/";
  const GAS_WEB_APP_URL = ""; // isi URL deployment GAS sekolah jika sudah tersedia
  const button = document.getElementById("buat-lms");
  button.href = GAS_WEB_APP_URL
    ? FRONTEND_URL + "?gas=" + encodeURIComponent(GAS_WEB_APP_URL)
    : FRONTEND_URL;
})();
</script>
