name: Tupari LMS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/pembelajaran-tugas-single-spreadsheet]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
